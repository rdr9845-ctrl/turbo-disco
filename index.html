<!DOCTYPE html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Basketball Manager Career</title><link rel="manifest" href="/manifest.json"><meta name="theme-color" content="#ff6a13"><link rel="apple-touch-icon" href="/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#121316;--p:#1c1e23;--p2:#262930;--o:#ff6a13;--t:#f4f2ee;--m:#9a9ca4;--g:#3ddc84;--r:#ff5252;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--t);font:15px/1.4 Barlow,system-ui,sans-serif}
h1,h2,h3,.big{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:800;letter-spacing:.5px}
h1{font-size:48px;line-height:1}h2{font-size:26px;margin:6px 0}h3{font-size:19px;margin-bottom:6px}
button{font:inherit;background:var(--p2);color:var(--t);border:1px solid #3a3d46;border-radius:8px;padding:10px 14px;cursor:pointer}
button.pri{background:var(--o);border-color:var(--o);color:#1a0d02;font-weight:700}
button.sm{padding:4px 9px;font-size:13px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--o);outline-offset:2px}
input,select{font:inherit;background:var(--p2);color:var(--t);border:1px solid #3a3d46;border-radius:8px;padding:9px;width:100%}
input[type=range]{padding:0}input[type=color]{height:40px;padding:2px}
.w{max-width:980px;margin:auto;padding:14px}
.card{background:var(--p);border:1px solid #2c2f37;border-radius:12px;padding:14px;margin:10px 0}
.nav{display:flex;gap:6px;overflow-x:auto;padding:8px 0;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
.nav button{white-space:nowrap;padding:8px 12px}.nav .on{background:var(--o);color:#1a0d02;border-color:var(--o);font-weight:700}
.sc{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:6px 5px;text-align:right;white-space:nowrap}th{color:var(--m);font-weight:500}
th:nth-child(-n+2),td:nth-child(-n+2){text-align:left}tr.me{background:#ff6a1326}tbody tr{border-top:1px solid #272a31}
.em{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;font:800 12px "Barlow Condensed",sans-serif;color:#fff;vertical-align:middle;border:2px solid #fff4;flex:none}
.ovr{display:inline-block;min-width:32px;text-align:center;border-radius:6px;font-weight:700;padding:1px 5px;color:#111}
.bar{height:10px;background:#2c2f37;border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--o)}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.col{display:flex;flex-direction:column;gap:10px;max-width:320px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.m{color:var(--m)}.g{color:var(--g)}.r{color:var(--r)}.sp{justify-content:space-between}
.hero{min-height:90vh;display:flex;flex-direction:column;justify-content:center;gap:18px}
.ball{width:120px;height:120px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff9a52,#ff6a13 55%,#b8420a);position:relative;box-shadow:0 0 60px #ff6a1355}
.ball:before,.ball:after{content:"";position:absolute;inset:0;border-radius:50%;border:3px solid #2a1206aa;clip-path:inset(0 50% 0 0)}
.ball:after{clip-path:inset(0 0 0 50%);transform:rotate(90deg)}
.seg{display:flex;gap:6px;flex-wrap:wrap}.seg .on{background:var(--o);color:#1a0d02;border-color:var(--o);font-weight:700}
canvas{width:100%;background:#2a1f16;border-radius:10px;display:block}
.score{font:800 40px "Barlow Condensed",sans-serif;text-align:center}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--o);color:#1a0d02;padding:10px 16px;border-radius:8px;font-weight:600;z-index:9;display:none}
#np{position:fixed;left:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px));background:#000b;border:1px solid #3a3d46;border-radius:20px;padding:4px 12px;font-size:12px;z-index:8;display:none;max-width:70vw}
@media(max-width:600px){h1{font-size:38px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}

.mm{--u:1vh;position:fixed;top:0;left:0;width:100%;height:calc(var(--u)*100);overflow:hidden;background:#050403;z-index:1;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;font-family:"Barlow Condensed","Arial Narrow","Roboto Condensed",sans-serif}
@supports(height:100dvh){.mm{--u:1dvh}}
.mm-bg{position:absolute;inset:-5%;background:var(--mmimg) center/cover no-repeat;filter:blur(26px) brightness(.38) saturate(1.1)}
.mm-st{position:absolute;top:0;height:100%;width:calc(var(--u)*177.683);left:20%;transform:translateX(-20%);background:var(--mmimg) 0 0/100% 100% no-repeat}
@media(min-aspect-ratio:1672/941){.mm-st{left:50%;transform:translateX(-50%);-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 2.5%,#000 97.5%,transparent 100%);mask-image:linear-gradient(90deg,transparent 0,#000 2.5%,#000 97.5%,transparent 100%)}}
.mmlogo{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mmi{position:absolute;left:3.648%;width:29.067%;top:var(--t);height:var(--h);transition:filter .2s,transform .18s cubic-bezier(.2,.8,.2,1)}
.mmb{position:relative;display:block;width:100%;height:100%;padding:0;margin:0;border:0;overflow:hidden;cursor:pointer;outline:0;color:#fff;font:inherit;
border-radius:calc(var(--u)*.7) 0 0 calc(var(--u)*.7);clip-path:polygon(0 0,98.6% 0,100% 18%,100% 82%,98.6% 100%,0 100%);
background:linear-gradient(180deg,#1d1c1c 0%,#0e0e0e 55%,#070707 100%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.13),inset 0 -2px 0 rgba(255,106,19,.45);transition:box-shadow .2s,filter .12s}
.mmb::before,.mmb::after{content:"";position:absolute;inset:0;opacity:0;transition:opacity .2s;pointer-events:none}
.mmb::before{background:linear-gradient(180deg,#ff9a3c 0%,#f56d08 52%,#cf4d00 100%)}
.mmb::after{background:linear-gradient(180deg,rgba(255,255,255,.3),rgba(255,255,255,0) 48%)}
.mmi.sel{z-index:2;transform:scale(1.014);filter:drop-shadow(0 0 calc(var(--u)*1.3) rgba(255,106,19,.7))}
.mmi.sel .mmb{box-shadow:inset 0 0 0 1px rgba(255,214,170,.8),inset 0 -2px 0 rgba(120,35,0,.6)}
.mmi.sel .mmb::before,.mmi.sel .mmb::after{opacity:1}
.mmi.press{animation:mmPress .17s ease-out}
.mmi.press .mmb{filter:brightness(1.3)}
.mmb:focus-visible{outline:2px solid #fff;outline-offset:-5px}
.mmb .ic{position:absolute;z-index:1;left:11.6%;top:50%;width:8.6%;height:auto;aspect-ratio:1;transform:translate(-50%,-50%);filter:drop-shadow(0 1px 2px rgba(0,0,0,.5))}
.mmb .lb{transform-origin:left center;position:absolute;z-index:1;left:25.4%;top:50%;transform:translateY(-50%);font-size:calc(var(--u)*3.4);font-style:italic;font-weight:800;text-transform:uppercase;letter-spacing:.015em;line-height:1;white-space:nowrap;text-shadow:0 2px 3px rgba(0,0,0,.55)}
.mmb .rp{position:absolute;z-index:0;width:calc(var(--u)*6);aspect-ratio:1;border-radius:50%;background:rgba(255,255,255,.6);pointer-events:none;transform:translate(-50%,-50%) scale(0);animation:mmRp .6s ease-out forwards}
@keyframes mmPress{0%{transform:scale(1.014)}45%{transform:scale(.955)}100%{transform:scale(1.014)}}
@keyframes mmRp{from{transform:translate(-50%,-50%) scale(0);opacity:.75}to{transform:translate(-50%,-50%) scale(14);opacity:0}}
@keyframes mmFade{from{opacity:0}to{opacity:1}}
@keyframes mmPop{from{transform:translateY(12px) scale(.96);opacity:0}to{transform:none;opacity:1}}
/* modais */
.mm-md{position:absolute;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(0,0,0,.72);animation:mmFade .2s;font-family:Barlow,system-ui,sans-serif}

function mmBind(){const r=$(".mm-st"),f=e=>e.target.closest&&e.target.closest(".mmb");
r.addEventListener("pointerover",e=>{const b=f(e);if(b)mmSelect(+b.dataset.i,e.pointerType=="mouse")});
r.addEventListener("focusin",e=>{const b=f(e);if(b)mmSelect(+b.dataset.i,0)});
r.addEventListener("click",e=>{const b=f(e);if(b)mmGo(+b.dataset.i,b,e)});
if(!mmKb){mmKb=1;document.addEventListener("keydown",mmKey);addEventListener("resize",mmFit)}mmFit()}
function mmFit(){document.querySelectorAll(".mmb .lb").forEach(l=>{l.style.transform="";const b=l.parentNode,av=b.clientWidth*.955-l.offsetLeft;if(l.offsetWidth>av)l.style.transform=`translateY(-50%) scaleX(${(av/l.offsetWidth).toFixed(3)})`})}
function mmSelect(i,snd){if(i===mmSel&&$(".mmi.sel"))return;mmSel=i;document.querySelectorAll(".mmi").forEach((e,k)=>e.classList.toggle("sel",k==i));if(snd)sfx("hover")}
function mmGo(i,b,e){if(mmBusy)return;mmBusy=1;mmSelect(i,0);const w=b.parentNode;w.classList.remove("press");void w.offsetWidth;w.classList.add("press");
const r=b.getBoundingClientRect(),p=document.createElement("i");p.className="rp";p.style.left=(e&&e.detail?e.clientX-r.left:r.width/2)+"px";p.style.top=(e&&e.detail?e.clientY-r.top:r.height/2)+"px";b.appendChild(p);setTimeout(()=>p.remove(),600);
sfx("click");setTimeout(()=>{mmBusy=0;w.classList.remove("press");MB[i].a()},170)}
function mmKey(e){if(scr!="menu"||!$(".mm"))return;if($(".mm-md")){if(e.key=="Escape")mmClose();return}
const k=e.key;if(k=="ArrowDown"||k=="ArrowUp"){e.preventDefault();const n=(mmSel+(k=="ArrowDown"?1:MB.length-1))%MB.length;mmSelect(n,1);const b=document.querySelector(`.mmb[data-i="${n}"]`);b&&b.focus({preventScroll:true})}
else if((k=="Enter"||k==" ")&&!(document.activeElement&&document.activeElement.classList.contains("mmb"))){e.preventDefault();const b=document.querySelector(`.mmb[data-i="${mmSel}"]`);b&&b.click()}}
/* efeitos sonoros (respeitam as Definições: efeitos ligados + volumes) */
function sfx(k){try{if(!st.so)return;const a=ac();if(!a)return;a.resume&&a.resume();const v=st.snd*st.vol/10000;if(v<=0)return;const t=a.currentTime;
const n=(f,t0,d,g,w,f2)=>{const o=a.createOscillator(),e=a.createGain();o.type=w;o.frequency.setValueAtTime(f,t0);f2&&o.frequency.exponentialRampToValueAtTime(f2,t0+d);e.gain.setValueAtTime(.0001,t0);e.gain.exponentialRampToValueAtTime(Math.max(.0002,g*v),t0+.008);e.gain.exponentialRampToValueAtTime(.0001,t0+d);o.connect(e);e.connect(a.destination);o.start(t0);o.stop(t0+d+.02)};
if(k=="hover")n(720,t,.06,.18,"sine",980);
else if(k=="click"){n(330,t,.09,.5,"square",660);n(990,t+.05,.12,.35,"triangle")}
else if(k=="err")n(220,t,.18,.45,"sawtooth",150)}catch(e){}}

function tOver(){const t=T(),rd=G.fix[G.r],m=rd.m.find(x=>x.includes(G.me)),h=m[0]==G.me,o=G.teams[h?m[1]:m[0]],l=[...G.hist].reverse().find(x=>!x.pre)||G.hist[G.hist.length-1],rk=tbl().indexOf(t)+1;
